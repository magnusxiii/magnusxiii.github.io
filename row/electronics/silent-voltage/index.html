function cardHTML(p, compact = false) {
  const ob = openBugs(p.id).length;
  const tk = tasksOf(p.id); const td = tk.filter((t) => t.done).length;
  const tags = tagsOf(p).slice(0, 4);
  return `<article class="card" tabindex="0" data-open="${p.id}" style="--pc:${esc(p.color || COLORS[0])}" ${compact ? 'draggable="true"' : ''}>
    <div class="card-h"><h3>${esc(p.title)}</h3>${p.pinned ? `<span class="pin" title="Καρφιτσωμένο">${ic('pin')}</span>` : ''}</div>
    ${compact ? '' : `<p class="sum">${esc(p.summary) || '<span style="opacity:.6">Χωρίς περίληψη</span>'}</p>`}
    <div class="badges">
      ${compact ? '' : `<span class="badge" style="--c:${sColor(p.status)}"><span class="dot"></span>${ST[p.status] || p.status}</span>`}
      ${p.release !== 'none' ? `<span class="badge" style="--c:${rColor(p.release)}">${ic('rocket')}${RL[p.release]}</span>` : ''}
      ${p.version ? `<span class="badge ver">${esc(p.version)}</span>` : ''}
      ${!compact && p.category ? `<span class="badge plain">${esc(p.category)}</span>` : ''}
    </div>
    ${!compact && tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="prog" title="Πρόοδος ${p.progress}%"><i style="width:${p.progress}%"></i></div>
    <div class="card-f">
      <span title="Προτεραιότητα" style="color:${pColor(p.priority)}">● ${PR[p.priority]}</span>
      ${ob ? `<span class="bugs-open">${ic('bug')}${ob}</span>` : ''}
      ${tk.length ? `<span>${ic('tasks')}${td}/${tk.length}</span>` : ''}
      <span class="right">${p.progress}% · ${ago(p.updated_at)}</span>
    </div>
  </article>`;
}

function emptyState() {
  const filteredOut = S.data.projects.length > 0;
  return `<div class="empty">
    <div class="big">${ic(filteredOut ? 'list' : 'bulb')}</div>
    <h3>${filteredOut ? 'Τίποτα με αυτά τα φίλτρα' : 'Δεν υπάρχουν ακόμα ιδέες'}</h3>
    <p>${filteredOut ? 'Άλλαξε τα φίλτρα ή την αναζήτηση.' : 'Γράψε την πρώτη σου ιδέα ή κάνε εισαγωγή από αρχείο JSON (π.χ. TA_PROJECT_MOU.json).'}</p>
    ${filteredOut ? '<button class="btn" data-act="clear-filters">Καθαρισμός φίλτρων</button>'
      : `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="new">${ic('plus')}Νέα ιδέα</button><button class="btn" data-act="import">${ic('upload')}Εισαγωγή JSON</button></div>`}
  </div>`;
}

function renderGrid(list) {
  if (!list.length) return emptyState();
  return `<div class="grid">${list.map((p) => cardHTML(p)).join('')}</div>`;
}

function renderBoard(list) {
  if (!S.data.projects.length) return emptyState();
  const cols = S.f.status === 'all' ? STATUSES : STATUSES.filter(([k]) => k === S.f.status);
  return `<div class="board">${cols.map(([k, l]) => {
    const items = list.filter((p) => p.status === k);
    return `<section class="col" data-col="${k}" style="--c:${sColor(k)}">
      <div class="col-h"><span class="dot"></span>${l}<span class="n">${items.length}</span></div>
      ${items.map((p) => cardHTML(p, true)).join('') || '<div class="col-empty">Σύρε μια κάρτα εδώ</div>'}
    </section>`;
  }).join('')}</div>`;
}

function bugHTML(b, withProject = false) {
  const p = projOf(b.project_id);
  const sev = `<span class="sev" style="--c:${pColor(b.severity)}">${SV[b.severity] || b.severity}</span>`;
  const projTag = withProject && p ? `<span class="bug-proj" data-open="${p.id}" style="--pc:${esc(p.color)}"><i></i>${esc(p.title)}</span>` : '';
  if (b.status === 'open') {
    return `<div class="bug open" data-bug="${b.id}">
      <div class="bug-main">
        <div class="bug-title">${esc(b.title)}</div>
        ${b.description ? `<div class="bug-desc">${esc(b.description)}</div>` : ''}
        <div class="bug-meta">${sev}${projTag}<span>Εντοπίστηκε ${fmtDate(b.created_at)}</span>${b.version_found ? `<span>στην <code>${esc(b.version_found)}</code></span>` : ''}</div>
      </div>
      <div class="bug-side"><div class="bug-actions">
        <button class="btn sm ok" data-act="fix" data-id="${b.id}">${ic('check')}Διορθώθηκε</button>
        <button class="icon-btn sm" data-act="edit-bug" data-id="${b.id}" title="Επεξεργασία">${ic('edit')}</button>
      </div></div>
    </div>`;
  }
  const won = b.status === 'wontfix';
  return `<div class="bug ${b.status}" data-bug="${b.id}">
    <div class="bug-main">
      <div class="bug-title">${esc(b.title)}</div>
      ${b.description ? `<div class="bug-desc">${esc(b.description)}</div>` : ''}
      <div class="bug-meta">${sev}${projTag}<span>Εντοπίστηκε ${fmtDate(b.created_at)}</span>${b.version_found ? `<span>στην <code>${esc(b.version_found)}</code></span>` : ''}</div>
    </div>
    <div class="bug-side">
      <div class="fixinfo">
        <b>${won ? ic('x') + 'Δεν θα διορθωθεί' : ic('check') + 'Διορθώθηκε'}</b> · ${fmtDate(b.fixed_at)}${b.fix_patch ? ` · <code>${esc(b.fix_patch)}</code>` : ''}
        ${b.fix_method ? `<div class="how">${won ? '' : 'με: '}${esc(b.fix_method)}</div>` : ''}
      </div>
      <div class="bug-actions">
        <button class="btn sm ghost" data-act="reopen" data-id="${b.id}" title="Άνοιγμα ξανά">${ic('undo')}Άνοιγμα ξανά</button>
        <button class="icon-btn sm" data-act="edit-bug" data-id="${b.id}" title="Επεξεργασία">${ic('edit')}</button>
      </div>
    </div>
  </div>`;
}

function sortBugs(arr) {
  const sevN = { critical: 0, high: 1, medium: 2, low: 3 };
  return [...arr].sort((a, b) => {
    if ((a.status === 'open') !== (b.status === 'open')) return a.status === 'open' ? -1 : 1;
    if (a.status === 'open') return (sevN[a.severity] - sevN[b.severity]) || (a.created_at < b.created_at ? 1 : -1);
    return (a.fixed_at || '') < (b.fixed_at || '') ? 1 : -1;
  });
}

function renderAllBugs() {
  const ql = S.f.q.trim().toLowerCase();
  let arr = S.data.bugs.filter((b) => {
    if (S.f.bugs === 'open' && b.status !== 'open') return false;
    if (S.f.bugs === 'fixed' && b.status === 'open') return false;
    const p = projOf(b.project_id);
    if (!p) return false;
    if (S.f.status !== 'all' && p.status !== S.f.status) return false;
    if (S.f.release === 'released' ? !RELEASED.includes(p.release) : (S.f.release !== 'all' && p.release !== S.f.release)) return false;
    if (S.f.priority !== 'all' && p.priority !== S.f.priority) return false;
    if (ql && !ql.split(/\s+/).every((w) => [b.title, b.description, b.fix_method, b.fix_patch, p.title].join(' ').toLowerCase().includes(w))) return false;
    return true;
  });
  arr = sortBugs(arr);
  const seg = (k, l) => `<button data-bf="${k}" class="${S.f.bugs === k ? 'on' : ''}">${l}</button>`;
  return `<div class="list-head"><div class="seg">${seg('open', 'Ανοιχτά')}${seg('fixed', 'Διορθωμένα')}${seg('all', 'Όλα')}</div>
    <span style="color:var(--muted);font-size:13px">${arr.length} ${arr.length === 1 ? 'εγγραφή' : 'εγγραφές'}</span></div>
    ${arr.length ? arr.map((b) => bugHTML(b, true)).join('')
      : `<div class="empty"><div class="big">${ic('bug')}</div><h3>${S.f.bugs === 'open' ? 'Κανένα ανοιχτό bug' : 'Δεν υπάρχουν bugs εδώ'}</h3><p>Τα bugs προστίθενται μέσα από κάθε ιδέα, στην καρτέλα «Bugs».</p></div>`}`;
}

function bindMain() {
  $$('[data-status]').forEach((b) => b.onclick = () => { S.f.status = b.dataset.status; render(); });
  $('#fRelease').onchange = (e) => { S.f.release = e.target.value; render(); };
  $('#fPriority').onchange = (e) => { S.f.priority = e.target.value; render(); };
  $('#fSort').onchange = (e) => { S.f.sort = e.target.value; persistUI(); render(); };
  $$('[data-view]').forEach((b) => b.onclick = () => { S.view = b.dataset.view; persistUI(); render(); });
  $$('[data-bf]').forEach((b) => b.onclick = () => { S.f.bugs = b.dataset.bf; render(); });
  $$('[data-jump]').forEach((b) => b.onclick = () => {
    const j = b.dataset.jump;
    S.f.release = 'all'; S.f.priority = 'all';
    if (j === 'all') { S.f.status = 'all'; if (S.view === 'bugs') S.view = 'grid'; }
    if (j === 'development') { S.f.status = 'development'; if (S.view === 'bugs') S.view = 'grid'; }
    if (j === 'ready') { S.f.status = 'ready'; if (S.view === 'bugs') S.view = 'grid'; }
    if (j === 'openbugs') { S.f.status = 'all'; S.view = 'bugs'; S.f.bugs = 'open'; }
    if (j === 'fixedbugs') { S.f.status = 'all'; S.view = 'bugs'; S.f.bugs = 'fixed'; }
    persistUI(); render();
  });
  $$('#content [data-open]').forEach((el) => {
    el.onclick = (e) => { if (e.target.closest('button')) return; openDrawer(el.dataset.open); };
    el.onkeydown = (e) => { if (e.key === 'Enter') openDrawer(el.dataset.open); };
  });
  bindBugActions($('#content'));
  $$('#content [data-act="new"]').forEach((b) => b.onclick = () => projectForm());
  $$('#content [data-act="import"]').forEach((b) => b.onclick = () => { settingsForm(); setTimeout(() => $('#impFile')?.click(), 120); });
  $$('#content [data-act="clear-filters"]').forEach((b) => b.onclick = () => { Object.assign(S.f, { q: '', status: 'all', release: 'all', priority: 'all' }); $('#q').value = ''; render(); });

  // drag & drop στο board
  if (S.view === 'board') {
    $$('.col .card').forEach((c) => {
      c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.dataset.open); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
    });
    $$('.col').forEach((col) => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop'); });
      col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e) => {
        e.preventDefault(); col.classList.remove('drop');
        const id = e.dataTransfer.getData('text/plain'); const p = projOf(id);
        if (p && p.status !== col.dataset.col) mutate(() => DB.update('projects', id, { status: col.dataset.col }), `«${p.title}» → ${ST[col.dataset.col]}`);
      });
    });
  }
}

function bindBugActions(root) {
  $$('[data-act="fix"]', root).forEach((b) => b.onclick = (e) => { e.stopPropagation(); fixForm(b.dataset.id); });
  $$('[data-act="reopen"]', root).forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    const bug = S.data.bugs.find((x) => x.id === b.dataset.id);
    if (await confirmBox('Άνοιγμα ξανά;', `Το «${bug.title}» θα ξαναγίνει ανοιχτό bug. Οι σημειώσεις διόρθωσης κρατιούνται στο ιστορικό.`, 'Άνοιγμα ξανά'))
      mutate(() => DB.update('bugs', bug.id, { status: 'open' }), 'Το bug άνοιξε ξανά');
  });
  $$('[data-act="edit-bug"]', root).forEach((b) => b.onclick = (e) => { e.stopPropagation(); bugForm(S.data.bugs.find((x) => x.id === b.dataset.id)); });
  $$('.bug-proj[data-open]', root).forEach((el) => el.onclick = (e) => { e.stopPropagation(); openDrawer(el.dataset.open, 'bugs'); });
}

// ---------- drawer (λεπτομέρειες ιδέας) ----------
let drawerEls = null;
function openDrawer(id, tab = 'overview') {
  S.open = id; S.tab = tab; S.bugFilter = 'all';
  if (!drawerEls) {
    const ov = document.createElement('div'); ov.className = 'overlay';
    const dr = document.createElement('aside'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
    document.body.append(ov, dr);
    ov.onclick = closeDrawer;
    drawerEls = { ov, dr };
    requestAnimationFrame(() => { ov.classList.add('show'); dr.classList.add('show'); });
    document.body.style.overflow = 'hidden';
  }
  renderDrawer();
}
function closeDrawer() {
  if (!drawerEls) return;
  const { ov, dr } = drawerEls; drawerEls = null; S.open = null;
  ov.classList.remove('show'); dr.classList.remove('show');
  setTimeout(() => { ov.remove(); dr.remove(); }, 230);
  if (!$('.modal')) document.body.style.overflow = '';
}

function renderDrawer() {
  const p = projOf(S.open); if (!p || !drawerEls) return;
  const bugs = bugsOf(p.id), ob = bugs.filter((b) => b.status === 'open').length;
  const tasks = tasksOf(p.id), logs = logsOf(p.id);
  const tab = (k, icon, label, cnt, red) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${ic(icon)}${label}${cnt !== undefined ? `<span class="cnt ${red ? 'red' : ''}">${cnt}</span>` : ''}</button>`;
  const scroll = $('.d-body', drawerEls.dr)?.scrollTop || 0;
  drawerEls.dr.style.setProperty('--pc', p.color || COLORS[0]);
  drawerEls.dr.innerHTML = `
    <div class="d-head">
      <div class="d-top">
        <h2>${esc(p.title)}</h2>
        <button class="icon-btn" data-d="close" title="Κλείσιμο (Esc)" aria-label="Κλείσιμο">${ic('x')}</button>
      </div>
      ${p.summary ? `<p class="d-sum">${esc(p.summary)}</p>` : '<div style="height:10px"></div>'}
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="badges">
          <span class="badge" style="--c:${sColor(p.status)}"><span class="dot"></span>${ST[p.status]}</span>
          <span class="badge" style="--c:${rColor(p.release)}">${RL[p.release]}</span>
          ${p.version ? `<span class="badge ver">${esc(p.version)}</span>` : ''}
          <span class="badge" style="--c:${pColor(p.priority)}">Προτερ.: ${PR[p.priority]}</span>
        </div>
        <div class="d-acts">
          <button class="btn sm" data-d="edit">${ic('edit')}Επεξεργασία</button>
          <button class="btn sm" data-d="pin">${ic('pin')}${p.pinned ? 'Ξεκαρφίτσωμα' : 'Καρφίτσωμα'}</button>
          <button class="btn sm" data-d="pdf">${ic('pdf')}PDF</button>
          <button class="icon-btn sm" data-d="delete" title="Διαγραφή ιδέας" aria-label="Διαγραφή">${ic('trash')}</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        ${tab('overview', 'info', 'Επισκόπηση')}
        ${tab('bugs', 'bug', 'Bugs', ob ? ob : bugs.length, ob > 0)}
        ${tab('tasks', 'tasks', 'Εργασίες', tasks.length ? `${tasks.filter((t) => t.done).length}/${tasks.length}` : 0)}
        ${tab('history', 'history', 'Ιστορικό', logs.length)}
      </div>
    </div>
    <div class="d-body">${{ overview: dOverview, bugs: dBugs, tasks: dTasks, history: dHistory }[S.tab](p)}</div>`;
  $('.d-body', drawerEls.dr).scrollTop = scroll;
  bindDrawer(p);
}

function dOverview(p) {
  const url = safeUrl(p.repo_url);
  const tags = tagsOf(p);
  const m = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  return `
    <h4 class="section-t">Στοιχεία</h4>
    <dl class="meta">
      ${m('Κατάσταση', `<span style="color:${sColor(p.status)}">●</span> ${ST[p.status]}`)}
      ${m('Release', `<span style="color:${rColor(p.release)}">●</span> ${RL[p.release]}`)}
      ${m('Έκδοση', p.version ? `<code>${esc(p.version)}</code>` : '—')}
      ${m('Πρόοδος', `${p.progress}%<div class="prog" style="margin-top:7px;--pc:${esc(p.color)}"><i style="width:${p.progress}%"></i></div>`)}
      ${m('Κατηγορία', esc(p.category) || '—')}
      ${m('Προτεραιότητα', `<span style="color:${pColor(p.priority)}">●</span> ${PR[p.priority]}`)}
      ${m('Δημιουργία', fmtDate(p.created_at))}
      ${m('Τελευταία αλλαγή', `${fmtDate(p.updated_at, true)}`)}
      ${url ? `<div style="grid-column:1/-1"><dt>Σύνδεσμος</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(p.repo_url)}</a></dd></div>` : ''}
      ${tags.length ? `<div style="grid-column:1/-1"><dt>Tags</dt><dd><div class="tags" style="margin-top:3px">${tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}</div></dd></div>` : ''}
    </dl>
    <h4 class="section-t">Περιγραφή</h4>
    <div class="prose">${md(p.description) || '<p class="empty-prose">Δεν υπάρχει περιγραφή. Πάτα «Επεξεργασία» για να γράψεις λεπτομέρειες, υλικά, σημειώσεις.</p>'}</div>`;
}

function dBugs(p) {
  const all = sortBugs(bugsOf(p.id));
  const list = all.filter((b) => S.bugFilter === 'all' || (S.bugFilter === 'open' ? b.status === 'open' : b.status !== 'open'));
  const seg = (k, l, n) => `<button data-bfd="${k}" class="${S.bugFilter === k ? 'on' : ''}">${l} ${n}</button>`;
  const on = all.filter((b) => b.status === 'open').length;
  return `
    <form class="addbox" id="addBug" autocomplete="off">
      <input class="in" name="title" placeholder="Νέο bug — τι πρόβλημα βρήκες;" style="flex:1 1 260px" required maxlength="300">
      <select class="in" name="severity" style="width:auto">${SEVERITIES.map(([k, l]) => `<option value="${k}" ${k === 'medium' ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn primary" type="submit">${ic('plus')}Προσθήκη</button>
      <button class="btn" type="button" data-d="bug-full" title="Με περιγραφή και έκδοση">Αναλυτικά…</button>
    </form>
    ${all.length ? `<div class="subfilter"><div class="seg">${seg('all', 'Όλα', all.length)}${seg('open', 'Ανοιχτά', on)}${seg('fixed', 'Διορθωμένα', all.length - on)}</div></div>` : ''}
    <div id="bugList">${list.map((b) => bugHTML(b)).join('') || `<div class="empty" style="padding:40px 20px"><div class="big">${ic('bug')}</div><h3>${all.length ? 'Τίποτα εδώ' : 'Κανένα bug'}</h3><p>${all.length ? '' : 'Όταν βρεις πρόβλημα, γράψ’ το εδώ. Όταν το διορθώσεις δεν σβήνεται: διαγράφεται με γραμμή και γράφεις πώς διορθώθηκε.'}</p></div>`}</div>`;
}

function dTasks(p) {
  const tasks = tasksOf(p.id);
  const sorted = [...tasks].sort((a, b) => (a.done - b.done) || (a.created_at < b.created_at ? -1 : 1));
  const pct = tasks.length ? Math.round(tasks.filter((t) => t.done).length / tasks.length * 100) : 0;
  return `
    <form class="addbox" id="addTask" autocomplete="off">
      <input class="in" name="text" placeholder="Νέα εργασία, π.χ. «Σχηματικό στο KiCad»" style="flex:1 1 260px" required maxlength="500">
      <button class="btn primary" type="submit">${ic('plus')}Προσθήκη</button>
    </form>
    ${tasks.length ? `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--muted);font-size:13px">
      <div class="prog" style="flex:1"><i style="width:${pct}%"></i></div><span>${pct}% ολοκληρωμένο</span>
      ${pct !== p.progress ? `<button class="btn sm" data-d="sync-progress" title="Ορισμός προόδου ιδέας στο ${pct}%">Πρόοδος → ${pct}%</button>` : ''}</div>` : ''}
    ${sorted.map((t) => `<div class="task ${t.done ? 'done' : ''}">
      <button class="check ${t.done ? 'on' : ''}" data-task="${t.id}" aria-label="${t.done ? 'Αναίρεση' : 'Ολοκλήρωση'}">${ic('check')}</button>
      <span class="txt">${esc(t.text)}</span>
      ${t.done && t.done_at ? `<span style="color:var(--faint);font-size:12px">${fmtDate(t.done_at)}</span>` : ''}
      <button class="icon-btn sm del" data-deltask="${t.id}" title="Διαγραφή">${ic('trash')}</button>
    </div>`).join('') || `<div class="empty" style="padding:40px 20px"><div class="big">${ic('tasks')}</div><h3>Χωρίς εργασίες</h3><p>Χώρισε την ιδέα σε βήματα και τσέκαρέ τα όσο προχωράς.</p></div>`}`;
}

function dHistory(p) {
  const logs = logsOf(p.id);
  return `
    <form class="addbox" id="addNote" autocomplete="off">
      <input class="in" name="text" placeholder="Σημείωση στο ιστορικό, π.χ. «Παραγγέλθηκαν PCB»" style="flex:1 1 260px" required maxlength="2000">
      <button class="btn primary" type="submit">${ic('plus')}Σημείωση</button>
    </form>
    <div class="tl">${logs.map((l) => `<div class="tl-i" style="--c:${LOG_COLORS[l.kind] || 'var(--faint)'}">
      <div class="t">${esc(l.text)}</div>
      <div class="d">${fmtDate(l.created_at, true)} · ${ago(l.created_at)}${l.kind === 'note' ? ` <button class="icon-btn sm" data-dellog="${l.id}" title="Διαγραφή σημείωσης" style="width:24px;height:24px">${ic('trash')}</button>` : ''}</div>
    </div>`).join('') || '<p style="color:var(--faint)">Δεν υπάρχει ιστορικό.</p>'}</div>`;
}

function bindDrawer(p) {
  const dr = drawerEls.dr;
  $$('[data-tab]', dr).forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; $('.d-body', dr).scrollTop = 0; renderDrawer(); });
  $$('[data-d="close"]', dr).forEach((b) => b.onclick = closeDrawer);
  $('[data-d="edit"]', dr).onclick = () => projectForm(p);
  $('[data-d="pin"]', dr).onclick = () => mutate(() => DB.update('projects', p.id, { pinned: p.pinned ? 0 : 1 }), p.pinned ? 'Ξεκαρφιτσώθηκε' : 'Καρφιτσώθηκε');
  $('[data-d="pdf"]', dr).onclick = () => exportPDF([p], true);
  $('[data-d="delete"]', dr).onclick = async () => {
    if (await confirmBox('Διαγραφή ιδέας;', `Θα διαγραφεί οριστικά το «${p.title}» μαζί με ${bugsOf(p.id).length} bugs, ${tasksOf(p.id).length} εργασίες και το ιστορικό του. Δεν αναιρείται.`, 'Οριστική διαγραφή', true, p.title))
      mutate(() => DB.remove('projects', p.id), 'Η ιδέα διαγράφηκε');
  };
  const addBug = $('#addBug', dr);
  if (addBug) addBug.onsubmit = (e) => {
    e.preventDefault(); const f = new FormData(addBug);
    mutate(() => DB.create('bugs', { project_id: p.id, title: f.get('title'), severity: f.get('severity'), version_found: p.version || '' }), 'Το bug καταγράφηκε')
      .then(() => setTimeout(() => $('#addBug input')?.focus(), 30)).catch(() => {});
  };
  $$('[data-d="bug-full"]', dr).forEach((b) => b.onclick = () => bugForm(null, p.id, $('#addBug input').value));
  $$('[data-bfd]', dr).forEach((b) => b.onclick = () => { S.bugFilter = b.dataset.bfd; renderDrawer(); });
  bindBugActions(dr);
  const addTask = $('#addTask', dr);
  if (addTask) addTask.onsubmit = (e) => {
    e.preventDefault(); const t = new FormData(addTask).get('text');
    mutate(() => DB.create('tasks', { project_id: p.id, text: t })).then(() => setTimeout(() => $('#addTask input')?.focus(), 30)).catch(() => {});
  };
  $$('[data-task]', dr).forEach((b) => b.onclick = () => { const t = S.data.tasks.find((x) => x.id === b.dataset.task); mutate(() => DB.update('tasks', t.id, { done: t.done ? 0 : 1 })); });
  $$('[data-deltask]', dr).forEach((b) => b.onclick = () => mutate(() => DB.remove('tasks', b.dataset.deltask), 'Η εργασία διαγράφηκε'));
  $$('[data-d="sync-progress"]', dr).forEach((b) => b.onclick = () => {
    const ts = tasksOf(p.id); const pct = Math.round(ts.filter((t) => t.done).length / ts.length * 100);
    mutate(() => DB.update('projects', p.id, { progress: pct }), `Πρόοδος ${pct}%`);
  });
  const addNote = $('#addNote', dr);
  if (addNote) addNote.onsubmit = (e) => { e.preventDefault(); mutate(() => DB.create('logs', { project_id: p.id, kind: 'note', text: new FormData(addNote).get('text') }), 'Η σημείωση αποθηκεύτηκε'); };
  $$('[data-dellog]', dr).forEach((b) => b.onclick = () => mutate(() => DB.remove('logs', b.dataset.dellog)));
}

// ---------- modals ----------
function modal({ title, body, foot, narrow = false, onMount }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'overlay top';
    const m = document.createElement('div'); m.className = 'modal' + (narrow ? ' narrow' : ''); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<div class="m-head"><h3>${title}</h3><button class="icon-btn sm" data-m="x" aria-label="Κλείσιμο">${ic('x')}</button></div>
      <div class="m-body">${body}</div>${foot ? `<div class="m-foot">${foot}</div>` : ''}`;
    document.body.append(ov, m);
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => { ov.classList.add('show'); m.classList.add('show'); });
    const close = (v) => {
      ov.classList.remove('show'); m.classList.remove('show');
      setTimeout(() => { ov.remove(); m.remove(); if (!drawerEls && !$('.modal')) document.body.style.overflow = ''; }, 200);
      document.removeEventListener('keydown', onKey, true);
      resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Escape' && $$('.modal').pop() === m) { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', onKey, true);
    ov.onclick = () => close(null);
    $('[data-m="x"]', m).onclick = () => close(null);
    $$('[data-m="cancel"]', m).forEach((b) => b.onclick = () => close(null));
    onMount && onMount(m, close);
    setTimeout(() => { const f = $('[autofocus]', m) || $('input:not([type=hidden]):not([type=checkbox]),textarea', m); f && f.focus(); }, 60);
  });
}

function confirmBox(title, text, okLabel = 'OK', danger = false, typeToConfirm = '') {
  return modal({
    title: esc(title), narrow: true,
    body: `<p style="margin:0;color:var(--muted)">${esc(text)}</p>${typeToConfirm ? `<label class="field" style="margin-top:16px"><span>Για επιβεβαίωση γράψε: <b style="color:var(--text)">ΔΙΑΓΡΑΦΗ</b></span><input class="in" id="cfType" autocomplete="off"></label>` : ''}`,
    foot: `<button class="btn" data-m="cancel">Άκυρο</button><button class="btn ${danger ? 'danger' : 'primary'}" data-m="ok" ${typeToConfirm ? 'disabled' : ''}>${esc(okLabel)}</button>`,
    onMount: (m, close) => {
      const ok = $('[data-m="ok"]', m); ok.onclick = () => close(true);
      const t = $('#cfType', m); if (t) t.oninput = () => { ok.disabled = t.value.trim().toUpperCase() !== 'ΔΙΑΓΡΑΦΗ'; };
      if (!typeToConfirm) setTimeout(() => ok.focus(), 70);
    },
  });
}

function opts(arr, sel) { return arr.map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${l}</option>`).join(''); }

function projectForm(p = null) {
  const v = p || { title: '', summary: '', description: '', category: '', tags: '', status: 'idea', release: 'none', priority: 'medium', progress: 0, version: '', repo_url: '', color: COLORS[Math.floor(Math.random() * 5)], pinned: 0 };
  const cats = [...new Set(S.data.projects.map((x) => x.category).filter(Boolean))].sort();
  return modal({
    title: p ? 'Επεξεργασία ιδέας' : 'Νέα ιδέα',
    body: `<form class="form" id="pf" autocomplete="off">
      <label class="field full"><span>Τίτλος *</span><input class="in" name="title" value="${esc(v.title)}" required maxlength="200" placeholder="π.χ. Ασύρματος συναγερμός με CC1101" autofocus></label>
      <label class="field full"><span>Σύντομη περιγραφή</span><input class="in" name="summary" value="${esc(v.summary)}" maxlength="400" placeholder="Μία πρόταση: τι είναι και τι λύνει"></label>
      <label class="field"><span>Κατάσταση</span><select class="in" name="status">${opts(STATUSES, v.status)}</select></label>
      <label class="field"><span>Release</span><select class="in" name="release">${opts(RELEASES, v.release)}</select></label>
      <label class="field"><span>Έκδοση</span><input class="in mono" name="version" value="${esc(v.version)}" maxlength="40" placeholder="π.χ. v0.3.1" style="font-family:var(--mono)"></label>
      <label class="field"><span>Προτεραιότητα</span><select class="in" name="priority">${opts(PRIORITIES, v.priority)}</select></label>
      <label class="field"><span>Κατηγορία</span><input class="in" name="category" value="${esc(v.category)}" list="catlist" maxlength="60" placeholder="π.χ. RF, IoT, Εργασία"><datalist id="catlist">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <label class="field"><span>Tags</span><input class="in" name="tags" value="${esc(v.tags)}" maxlength="300" placeholder="ESP32, CC1101, KiCad"><small>Χωρισμένα με κόμμα</small></label>
      <div class="field full"><span>Πρόοδος</span><div class="range-row"><input type="range" name="progress" min="0" max="100" step="5" value="${v.progress}"><output>${v.progress}%</output></div></div>
      <label class="field full"><span>Σύνδεσμος (GitHub, φάκελος, έγγραφο)</span><input class="in" name="repo_url" value="${esc(v.repo_url)}" maxlength="500" placeholder="https://github.com/…"></label>
      <div class="field full"><span>Χρώμα</span><div class="swatches">${COLORS.map((c) => `<button type="button" class="sw ${c === v.color ? 'on' : ''}" style="--c:${c}" data-c="${c}" aria-label="Χρώμα ${c}"></button>`).join('')}
        <input type="color" name="color" value="${esc(v.color || COLORS[0])}" title="Δικό σου χρώμα" style="width:34px;height:30px;border:0;background:none;padding:0;cursor:pointer"></div></div>
      <label class="field full"><span>Αναλυτική περιγραφή</span><textarea class="in" name="description" rows="9" maxlength="100000" placeholder="Λεπτομέρειες, υλικά, σκέψεις…&#10;&#10;## Επικεφαλίδα&#10;- λίστα&#10;**έντονα**, \`κώδικας\`, [σύνδεσμος](https://…)">${esc(v.description)}</textarea><small>Υποστηρίζει απλό Markdown: # επικεφαλίδες, - λίστες, **έντονα**, \`κώδικας\`, \`\`\` μπλοκ κώδικα, συνδέσμους.</small></label>
      <label class="toggle field full" style="flex-direction:row"><input type="checkbox" name="pinned" ${v.pinned ? 'checked' : ''}> Καρφιτσωμένο στην κορυφή</label>
    </form>`,
    foot: `<button class="btn" data-m="cancel">Άκυρο</button><button class="btn primary" data-m="save">${ic('check')}${p ? 'Αποθήκευση' : 'Δημιουργία'}</button>`,
    onMount: (m, close) => {
      const f = $('#pf', m);
      const rng = $('input[type=range]', m); rng.oninput = () => { $('output', m).textContent = rng.value + '%'; };
      const col = $('input[type=color]', m);
      $$('.sw', m).forEach((b) => b.onclick = () => { $$('.sw', m).forEach((x) => x.classList.remove('on')); b.classList.add('on'); col.value = b.dataset.c; });
      col.oninput = () => $$('.sw', m).forEach((x) => x.classList.toggle('on', x.dataset.c === col.value));
      const save = async () => {
        if (!f.reportValidity()) return;
        const fd = new FormData(f);
        const body = Object.fromEntries(['title', 'summary', 'description', 'category', 'tags', 'status', 'release', 'priority', 'version', 'repo_url', 'color'].map((k) => [k, String(fd.get(k) || '').trim()]));
        body.progress = Number(fd.get('progress')); body.pinned = fd.get('pinned') ? 1 : 0;
        body.tags = tagsOf(body).join(', ');
        const btn = $('[data-m="save"]', m); btn.disabled = true;
        try {
          if (p) { await mutate(() => DB.update('projects', p.id, body), 'Αποθηκεύτηκε'); close(true); }
          else { const r = await mutate(() => DB.create('projects', body), 'Η ιδέα δημιουργήθηκε'); close(true); if (r && r.id) openDrawer(r.id); }
        } catch { btn.disabled = false; }
      };
      $('[data-m="save"]', m).onclick = save;
      f.onsubmit = (e) => { e.preventDefault(); save(); };
      f.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save(); });
    },
  });
}

function bugForm(b = null, projectId = null, presetTitle = '') {
  const p = projOf(b ? b.project_id : projectId);
  const v = b || { title: presetTitle, description: '', severity: 'medium', status: 'open', version_found: p?.version || '', fix_method: '', fix_patch: '', fixed_at: '' };
  return modal({
    title: b ? 'Επεξεργασία bug' : 'Νέο bug',
    body: `<form class="form" id="bf" autocomplete="off">
      <label class="field full"><span>Τίτλος *</span><input class="in" name="title" value="${esc(v.title)}" required maxlength="300" autofocus></label>
      <label class="field full"><span>Περιγραφή / πώς αναπαράγεται</span><textarea class="in" name="description" rows="4">${esc(v.description)}</textarea></label>
      <label class="field"><span>Σοβαρότητα</span><select class="in" name="severity">${opts(SEVERITIES, v.severity)}</select></label>
      <label class="field"><span>Βρέθηκε στην έκδοση</span><input class="in" name="version_found" value="${esc(v.version_found)}" maxlength="40" style="font-family:var(--mono)"></label>
      ${b ? `<label class="field"><span>Κατάσταση</span><select class="in" name="status">${opts([['open', 'Ανοιχτό'], ['fixed', 'Διορθώθηκε'], ['wontfix', 'Δεν θα διορθωθεί']], v.status)}</select></label>
      <label class="field"><span>Patch / έκδοση διόρθωσης</span><input class="in" name="fix_patch" value="${esc(v.fix_patch)}" maxlength="120" style="font-family:var(--mono)"></label>
      <label class="field full"><span>Μέθοδος διόρθωσης</span><textarea class="in" name="fix_method" rows="3">${esc(v.fix_method)}</textarea></label>` : ''}
    </form>`,
    foot: `${b ? `<button class="btn danger left" data-m="del">${ic('trash')}Διαγραφή</button>` : ''}<button class="btn" data-m="cancel">Άκυρο</button><button class="btn primary" data-m="save">${ic('check')}Αποθήκευση</button>`,
    onMount: (m, close) => {
      const f = $('#bf', m);
      const save = async () => {
        if (!f.reportValidity()) return;
        const body = Object.fromEntries([...new FormData(f)].map(([k, x]) => [k, String(x).trim()]));
        try {
          if (b) await mutate(() => DB.update('bugs', b.id, body), 'Αποθηκεύτηκε');
          else { await mutate(() => DB.create('bugs', { ...body, project_id: projectId }), 'Το bug καταγράφηκε'); const i = $('#addBug input'); if (i) i.value = ''; }
          close(true);
        } catch {}
      };
      $('[data-m="save"]', m).onclick = save;
      f.onsubmit = (e) => { e.preventDefault(); save(); };
      const del = $('[data-m="del"]', m);
      if (del) del.onclick = async () => {
        if (await confirmBox('Οριστική διαγραφή bug;', 'Συνήθως δεν χρειάζεται: ένα διορθωμένο bug μένει διαγραμμένο με γραμμή για ιστορικό. Διάγραψέ το μόνο αν καταχωρήθηκε κατά λάθος.', 'Διαγραφή', true)) {
          await mutate(() => DB.remove('bugs', b.id), 'Το bug διαγράφηκε'); close(true);
        }
      };
    },
  });
}

function fixForm(id) {
  const b = S.data.bugs.find((x) => x.id === id); const p = projOf(b.project_id);
  return modal({
    title: 'Σήμανση ως διορθωμένο', narrow: true,
    body: `<div class="bug open" style="margin-bottom:16px"><div class="bug-main"><div class="bug-title">${esc(b.title)}</div><div class="bug-meta"><span class="sev" style="--c:${pColor(b.severity)}">${SV[b.severity]}</span>${esc(p?.title || '')}</div></div></div>
      <form class="form" id="ff" autocomplete="off">
        <label class="field full"><span>Με ποια μέθοδο διορθώθηκε;</span><textarea class="in" name="fix_method" rows="4" autofocus placeholder="π.χ. Προστέθηκε debounce 50 ms στο PIR και watchdog στον Pico">${esc(b.fix_method)}</textarea></label>
        <label class="field"><span>Patch / έκδοση / commit</span><input class="in" name="fix_patch" value="${esc(b.fix_patch || p?.version || '')}" maxlength="120" placeholder="v1.2.1 ή a1b2c3d" style="font-family:var(--mono)"></label>
        <label class="field"><span>Ημερομηνία</span><input class="in" type="date" name="date" value="${dateInput()}"></label>
        <label class="toggle field full" style="flex-direction:row;font-weight:500;color:var(--muted)"><input type="checkbox" name="wontfix"> Δεν θα διορθωθεί (κλείνει χωρίς διόρθωση)</label>
      </form>`,
    foot: `<button class="btn" data-m="cancel">Άκυρο</button><button class="btn primary" data-m="save">${ic('check')}Διορθώθηκε</button>`,
    onMount: (m, close) => {
      const f = $('#ff', m);
      const wf = $('[name=wontfix]', m);
      wf.onchange = () => { $('[data-m="save"]', m).innerHTML = wf.checked ? ic('x') + 'Κλείσιμο' : ic('check') + 'Διορθώθηκε'; };
      const save = async () => {
        const fd = new FormData(f);
        const d = fd.get('date');
        const today = dateInput();
        const fixed_at = d && d !== today ? new Date(d + 'T12:00:00').toISOString() : nowIso();
        try {
          await mutate(() => DB.update('bugs', b.id, { status: fd.get('wontfix') ? 'wontfix' : 'fixed', fix_method: String(fd.get('fix_method')).trim(), fix_patch: String(fd.get('fix_patch')).trim(), fixed_at }), fd.get('wontfix') ? 'Το bug έκλεισε' : 'Μπράβο, διορθώθηκε');
          close(true);
        } catch {}
      };
      $('[data-m="save"]', m).onclick = save;
      f.onsubmit = (e) => { e.preventDefault(); save(); };
      f.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save(); });
    },
  });
}

// ---------- ρυθμίσεις ----------
function settingsForm() {
  const c = loadCfg();
  const remembered = !!SV_LS.getItem(CFG_KEY);
  return modal({
    title: 'Ρυθμίσεις',
    body: `
      <h4 class="section-t">Σύνδεση με Cloudflare</h4>
      <form class="form" id="sf" autocomplete="off" style="margin-bottom:20px">
        <label class="field full"><span>Διεύθυνση Worker</span><input class="in" name="apiUrl" value="${esc(c.apiUrl || '')}" placeholder="https://silent-voltage-api.xxx.workers.dev" style="font-family:var(--mono)"></label>
        <label class="field full"><span>Κλειδί πρόσβασης</span><div class="pw"><input class="in" type="password" name="apiKey" value="${esc(c.apiKey || '')}" placeholder="Το κλειδί από το API_KEY.txt" autocomplete="off"><button type="button" class="icon-btn sm" data-pw title="Εμφάνιση">${ic('eye')}</button></div></label>
        <label class="toggle field full" style="flex-direction:row"><input type="checkbox" name="remember" ${remembered || !c.apiKey ? 'checked' : ''}> Να το θυμάται αυτή η συσκευή</label>
      </form>
      <div class="hint" style="margin-bottom:22px">${ic('key')} Το κλειδί αποθηκεύεται μόνο σε αυτόν τον browser και στέλνεται μόνο στον Worker σου. Σε νέο υπολογιστή το ξαναγράφεις μία φορά. ${isDemo() ? '<br><b>Τώρα είσαι σε δοκιμαστική λειτουργία</b>: τα δεδομένα μένουν μόνο σε αυτόν τον browser.' : ''}</div>
      <h4 class="section-t">Αντίγραφα ασφαλείας</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px">
        <button class="btn" data-s="export">${ic('download')}Εξαγωγή JSON</button>
        <button class="btn" data-s="import">${ic('upload')}Εισαγωγή JSON</button>
        <input type="file" accept="application/json,.json" id="impFile" hidden>
      </div>
      <h4 class="section-t">Συντομεύσεις</h4>
      <div class="hint"><kbd>N</kbd> νέα ιδέα &nbsp; <kbd>/</kbd> αναζήτηση &nbsp; <kbd>Esc</kbd> κλείσιμο &nbsp; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> αποθήκευση φόρμας &nbsp; <kbd>R</kbd> ανανέωση</div>`,
    foot: `<button class="btn danger left" data-s="logout">${ic('logout')}${isDemo() ? 'Έξοδος από δοκιμή' : 'Αποσύνδεση'}</button><button class="btn" data-s="test">${ic('cloud')}Δοκιμή</button><button class="btn primary" data-s="save">${ic('check')}Αποθήκευση</button>`,
    onMount: (m, close) => {
      const f = $('#sf', m);
      $('[data-pw]', m).onclick = () => { const i = $('[name=apiKey]', m); i.type = i.type === 'password' ? 'text' : 'password'; $('[data-pw]', m).innerHTML = ic(i.type === 'password' ? 'eye' : 'eyeoff'); };
      const read = () => { const fd = new FormData(f); return { apiUrl: String(fd.get('apiUrl')).trim().replace(/\/+$/, ''), apiKey: String(fd.get('apiKey')).trim(), remember: !!fd.get('remember') }; };
      $('[data-s="test"]', m).onclick = async () => {
        const v = read();
        try { await apiCall('GET', '/api/ping', null, v); toast('Η σύνδεση λειτουργεί ✓'); } catch (e) { toast(e.message, true); }
      };
      $('[data-s="save"]', m).onclick = async () => {
        const v = read();
        if (!v.apiUrl || !v.apiKey) return toast('Συμπλήρωσε διεύθυνση και κλειδί', true);
        try { await apiCall('GET', '/api/ping', null, v); } catch (e) { return toast(e.message, true); }
        cfg = { apiUrl: v.apiUrl, apiKey: v.apiKey, mode: 'cloud' }; saveCfg(cfg, v.remember);
        close(true); S.loaded = false; await reload(true); toast('Συνδέθηκε με το Cloudflare');
      };
      $('[data-s="logout"]', m).onclick = async () => {
        if (!(await confirmBox(isDemo() ? 'Έξοδος από τη δοκιμή;' : 'Αποσύνδεση;', isDemo() ? 'Τα δοκιμαστικά δεδομένα μένουν σε αυτόν τον browser.' : 'Θα σβηστεί το κλειδί από αυτόν τον browser. Τα δεδομένα στο Cloudflare δεν επηρεάζονται.', 'Συνέχεια'))) return;
        cfg = { apiUrl: cfg.apiUrl }; try { SV_LS.removeItem(CFG_KEY); sessionStorage.removeItem(CFG_KEY); } catch {}
        close(true); closeDrawer(); showWelcome();
      };
      $('[data-s="export"]', m).onclick = exportJSON;
      const file = $('#impFile', m);
      $('[data-s="import"]', m).onclick = () => file.click();
      file.onchange = async () => {
        const fl = file.files[0]; if (!fl) return;
        let data; try { data = JSON.parse(await fl.text()); } catch { return toast('Μη έγκυρο αρχείο JSON', true); }
        if (!Array.isArray(data.projects)) return toast('Το αρχείο δεν είναι αντίγραφο του Silent Voltage', true);
        const replace = await confirmBox('Τρόπος εισαγωγής', `Το αρχείο έχει ${data.projects.length} ιδέες και ${(data.bugs || []).length} bugs. «Αντικατάσταση» σβήνει ό,τι υπάρχει τώρα. Με «Άκυρο» γίνεται συγχώνευση.`, 'Αντικατάσταση', true);
        close(true);
        await mutate(() => DB.importAll({ ...data, mode: replace ? 'replace' : 'merge' }), 'Η εισαγωγή ολοκληρώθηκε');
      };
    },
  });
}

function exportJSON() {
  const text = JSON.stringify({ app: 'silent-voltage', exported_at: nowIso(), ...S.data }, null, 2);
  if (window.SV_APP) { AndroidBridge.saveFile(`silent-voltage-backup-${dateInput()}.json`, 'application/json', text); return; }
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `silent-voltage-backup-${dateInput()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('Το αντίγραφο κατέβηκε');
}

// ---------- PDF ----------
function exportPDF(projects, single = false) {
  if (!projects.length) return toast('Δεν υπάρχουν ιδέες για εξαγωγή', true);
  const P = projects;
  const allBugs = P.flatMap((p) => bugsOf(p.id));
  const openN = allBugs.filter((b) => b.status === 'open').length;
  const today = new Date().toLocaleDateString('el-GR', { day: 'numeric', month: 'long', year: 'numeric' });
  const pb = (c, l) => `<span class="pb" style="--c:${c}">${l}</span>`;

  const projSection = (p, i) => {
    const bugs = sortBugs(bugsOf(p.id)); const tasks = tasksOf(p.id); const logs = logsOf(p.id).slice(0, 25);
    const m = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
    return `<section class="pr-proj ${i === 0 && single ? 'first' : ''}" style="--pc:${esc(p.color)}">
      <div class="pr-ph"><h1>${esc(p.title)}</h1>${p.summary ? `<p>${esc(p.summary)}</p>` : ''}</div>
      <dl class="pr-meta">
        ${m('Κατάσταση', pb(sColor(p.status), ST[p.status]))}
        ${m('Release', pb(rColor(p.release), RL[p.release]))}
        ${m('Έκδοση', p.version ? esc(p.version) : '—')}
        ${m('Προτεραιότητα', PR[p.priority])}
        ${m('Πρόοδος', `${p.progress}%<div class="pr-prog"><i style="width:${p.progress}%"></i></div>`)}
        ${m('Κατηγορία', esc(p.category) || '—')}
        ${m('Δημιουργία', fmtDate(p.created_at))}
        ${m('Τελευταία αλλαγή', fmtDate(p.updated_at))}
      </dl>
      ${tagsOf(p).length ? `<p class="muted" style="margin:0 0 6px;font-size:9pt">${tagsOf(p).map((t) => '#' + esc(t)).join(' &nbsp; ')}</p>` : ''}
      ${safeUrl(p.repo_url) ? `<p style="margin:0 0 6px;font-size:9pt">${esc(p.repo_url)}</p>` : ''}
      ${p.description ? `<h2 class="pr-h">Περιγραφή</h2><div class="prose">${md(p.description)}</div>` : ''}
      ${bugs.length ? `<h2 class="pr-h">Bugs — ${bugs.filter((b) => b.status === 'open').length} ανοιχτά / ${bugs.length}</h2>
        ${bugs.map((b) => `<div class="pr-bug ${b.status}">
          <div class="l"><div class="t"><span class="sevp" style="--c:${pColor(b.severity)}">${SV[b.severity]}</span>${esc(b.title)}</div>
            ${b.description ? `<div class="d">${esc(b.description)}</div>` : ''}
            <div class="d" style="font-size:8pt">Εντοπίστηκε ${fmtDate(b.created_at)}${b.version_found ? ' · ' + esc(b.version_found) : ''}</div></div>
          <div class="r">${b.status === 'open' ? '<span style="color:#d4243a;font-weight:700">Ανοιχτό</span>'
            : `<b>${b.status === 'fixed' ? '✓ Διορθώθηκε' : 'Δεν θα διορθωθεί'}</b> ${fmtDate(b.fixed_at)}${b.fix_patch ? ' · ' + esc(b.fix_patch) : ''}${b.fix_method ? `<div style="color:#141824;white-space:pre-wrap">${esc(b.fix_method)}</div>` : ''}`}</div>
        </div>`).join('')}` : ''}
      ${tasks.length ? `<h2 class="pr-h">Εργασίες — ${tasks.filter((t) => t.done).length}/${tasks.length}</h2>
        ${[...tasks].sort((a, b) => a.done - b.done).map((t) => `<div class="pr-task ${t.done ? 'done' : ''}">${t.done ? '☑' : '☐'} ${esc(t.text)}</div>`).join('')}` : ''}
      ${logs.length ? `<h2 class="pr-h">Ιστορικό</h2>${logs.map((l) => `<div class="pr-log"><span>${fmtDate(l.created_at, true)}</span><div>${esc(l.text)}</div></div>`).join('')}` : ''}
    </section>`;
  };

  const cover = single
    ? `<div class="pr-cover" style="padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg, ${esc(P[0].color)}, #0f172a)"><div class="k">Silent Voltage · Αναφορά project</div><div class="meta-line" style="margin:0">Magnus · ${today}</div></div>`
    : `<div class="pr-cover"><div class="k">Silent Voltage</div><h1>Αναφορά ιδεών &amp; projects</h1><p>${P.length} ${P.length === 1 ? 'ιδέα' : 'ιδέες'}${S.f.status !== 'all' || S.f.release !== 'all' || S.f.q ? ' (με τα τρέχοντα φίλτρα)' : ''}</p><div class="meta-line">Magnus · ${today}</div></div>
      <div class="pr-stats">
        <div><b>${P.length}</b><span>Σύνολο ιδεών</span></div>
        <div><b>${P.filter((p) => p.status === 'development').length}</b><span>Υπό ανάπτυξη</span></div>
        <div><b>${P.filter((p) => p.status === 'ready').length}</b><span>Έτοιμα</span></div>
        <div><b style="color:#d4243a">${openN}</b><span>Ανοιχτά bugs</span></div>
        <div><b style="color:#0b9467">${allBugs.filter((b) => b.status === 'fixed').length}</b><span>Διορθωμένα bugs</span></div>
      </div>
      <h2 class="pr-h">Σύνοψη</h2>
      <table><thead><tr><th>Ιδέα</th><th>Κατάσταση</th><th>Release</th><th>Έκδοση</th><th>Πρόοδος</th><th>Bugs</th></tr></thead><tbody>
      ${P.map((p) => { const ob = openBugs(p.id).length; return `<tr><td><b>${esc(p.title)}</b>${p.category ? `<div class="muted" style="font-size:8.5pt">${esc(p.category)}</div>` : ''}</td><td>${pb(sColor(p.status), ST[p.status])}</td><td>${pb(rColor(p.release), RL[p.release])}</td><td>${esc(p.version) || '—'}</td><td>${p.progress}%</td><td>${ob ? `<b style="color:#d4243a">${ob} ανοιχτά</b>` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
      </tbody></table>`;

  const root = $('#print-root');
  root.innerHTML = cover + P.map(projSection).join('') + `<div class="pr-foot">Silent Voltage · ${today}</div>`;
  const oldTitle = document.title;
  const slug = single ? P[0].title.replace(/[\\/:*?"<>|]+/g, '').slice(0, 60) : 'Αναφορά ιδεών';
  document.title = `${slug} — ${dateInput()}`;
  const done = () => { document.title = oldTitle; root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  if (window.SV_APP) {
    setTimeout(() => { AndroidBridge.printPage(document.title); setTimeout(() => { document.title = oldTitle; }, 3000); }, 120);
    toast('Διάλεξε «Αποθήκευση ως PDF» και πάτα το κουμπί PDF');
    return;
  }
  setTimeout(() => { window.print(); }, 60);
  toast('Στο παράθυρο εκτύπωσης διάλεξε «Αποθήκευση ως PDF»');
}

// ---------- welcome / σύνδεση ----------
function showWelcome(err = '') {
  S.loaded = false;
  $('#topbar').hidden = true;
  const c = loadCfg();
  $('#app').innerHTML = `<div class="welcome">
    <span class="logo" style="width:52px;height:52px;border-radius:15px">${ic('bolt')}</span>
    <h1>Silent Voltage</h1>
    <p>Ιδέες, καταστάσεις, releases και bugs σε ένα σημείο. Τα δεδομένα μένουν στη δική σου βάση Cloudflare D1.</p>
    ${err ? `<div class="hint" style="border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger);margin-bottom:16px">${esc(err)}</div>` : ''}
    <form class="form" id="wf" autocomplete="off" style="grid-template-columns:1fr">
      <label class="field"><span>Διεύθυνση Worker</span><input class="in" name="apiUrl" value="${esc(c.apiUrl || '')}" placeholder="https://silent-voltage-api.xxx.workers.dev" style="font-family:var(--mono)" required></label>
      <label class="field"><span>Κλειδί πρόσβασης</span><div class="pw"><input class="in" type="password" name="apiKey" placeholder="Από το αρχείο API_KEY.txt" required autocomplete="off"><button type="button" class="icon-btn sm" data-pw title="Εμφάνιση">${ic('eye')}</button></div></label>
      <label class="toggle"><input type="checkbox" name="remember" checked> Να το θυμάται αυτή η συσκευή</label>
      <button class="btn primary" type="submit" style="height:44px">${ic('key')}Σύνδεση</button>
    </form>
    <div style="display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--faint);font-size:12px"><div style="flex:1;height:1px;background:var(--border)"></div>ή<div style="flex:1;height:1px;background:var(--border)"></div></div>
    <button class="btn" id="demoBtn" style="width:100%">${ic('flask')}Δοκιμή χωρίς Cloudflare</button>
    <p style="text-align:center;font-size:12px;color:var(--faint);margin:8px 0 0">Η δοκιμή κρατά τα δεδομένα μόνο σε αυτή τη συσκευή.</p>
  </div>`;
  const f = $('#wf');
  $('[data-pw]', f).onclick = () => { const i = $('[name=apiKey]', f); i.type = i.type === 'password' ? 'text' : 'password'; };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const v = { apiUrl: String(fd.get('apiUrl')).trim().replace(/\/+$/, ''), apiKey: String(fd.get('apiKey')).trim() };
    const btn = $('button[type=submit]', f); btn.disabled = true; btn.innerHTML = 'Σύνδεση…';
    try {
      await apiCall('GET', '/api/ping', null, v);
      cfg = { ...v, mode: 'cloud' }; saveCfg(cfg, !!fd.get('remember'));
      $('#app').innerHTML = '<div class="loader"><div class="ring"></div>Φόρτωση…</div>';
      await reload(true);
    } catch (er) { toast(er.message, true); btn.disabled = false; btn.innerHTML = ic('key') + 'Σύνδεση'; }
  };
  $('#demoBtn').onclick = async () => {
    if (!Local.db()) { const d = demoExtras(starterData()); Local.save(d); }
    cfg = { ...cfg, mode: 'demo' }; saveCfg(cfg, true);
    await reload(true);
  };
}

// ---------- top bar & πλήκτρα ----------
function setThemeIcon() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#btnTheme').innerHTML = ic(dark ? 'sun' : 'moon');
  if (window.SV_APP) try { AndroidBridge.setDark(dark); } catch (e) {}
}
function initChrome() {
  $('#btnRefresh').innerHTML = ic('refresh');
  $('#btnSettings').innerHTML = ic('gear');
  $('#btnPdfAll').innerHTML = ic('pdf') + '<span class="lbl">PDF</span>';
  $('#btnNew').innerHTML = ic('plus') + '<span class="lbl">Νέα ιδέα</span>';
  setThemeIcon();
  $('#btnTheme').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; try { SV_LS.setItem('silentvoltage.theme', t); } catch {}
    $('meta[name=theme-color]').content = t === 'dark' ? '#0a0c12' : '#f3f4f8';
    setThemeIcon();
  };
  $('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'dark' ? '#0a0c12' : '#f3f4f8';
  $('#btnRefresh').onclick = () => reload();
  $('#btnSettings').onclick = settingsForm;
  $('#btnNew').onclick = () => projectForm();
  $('#btnPdfAll').onclick = () => exportPDF(S.view === 'bugs' ? S.data.projects : filtered());
  $('#brandLink').onclick = (e) => { e.preventDefault(); closeDrawer(); Object.assign(S.f, { q: '', status: 'all', release: 'all', priority: 'all' }); $('#q').value = ''; render(); };
  let qt;
  $('#q').oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { S.f.q = e.target.value; render(); }, 120); };
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if (e.key === 'Escape') { if ($('.modal')) return; if (drawerEls) return closeDrawer(); if (document.activeElement === $('#q')) $('#q').blur(); }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || !S.loaded || $('.modal')) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    else if (e.key === 'n' || e.key === 'N' || e.key === 'ν') { e.preventDefault(); projectForm(); }
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ρ') { e.preventDefault(); reload(); }
  });
  // φρέσκα δεδομένα όταν επιστρέφεις στην καρτέλα (π.χ. άλλαξες κάτι από το κινητό)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.loaded && Date.now() - S.lastLoad > 20000 && !$('.modal')) reload(true);
  });
}

// Κουμπί «πίσω» του Android: κλείνει πρώτα παράθυρα/καρτέλα. true = το χειρίστηκε η σελίδα.
window.svBack = function () {
  const ms = $$('.modal');
  if (ms.length) { const x = $('[data-m="x"]', ms[ms.length - 1]); if (x) x.click(); return true; }
  if (drawerEls) { closeDrawer(); return true; }
  if (S.loaded && (S.f.q || S.f.status !== 'all' || S.f.release !== 'all' || S.f.priority !== 'all' || S.view !== 'grid')) {
    Object.assign(S.f, { q: '', status: 'all', release: 'all', priority: 'all' }); S.view = 'grid'; $('#q').value = ''; persistUI(); render(); return true;
  }
  return false;
};
window.svResume = function () { if (S.loaded && Date.now() - S.lastLoad > 15000 && !$('.modal')) reload(true); };

initChrome();
if (isReady()) reload(true); else showWelcome();
</script>
</body>
